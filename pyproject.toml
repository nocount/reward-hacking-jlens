[project]
name = "rhjl"
version = "0.1.0"
description = "Reward hacking in Qwen3.5-2B: detect with probes, interpret with the Jacobian lens, compare mitigations"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    # vLLM 0.33 pins torch 2.14.0 and transformers <5.21; TRL's vllm extra wants vllm <0.34.
    "torch==2.14.0",
    "vllm==0.33.0",
    "transformers>=5.16.1,<5.21",
    "trl[peft,vllm]==1.18.2",
    "peft>=0.21",
    "accelerate>=1.14",
    "datasets>=4.5",
    "flash-linear-attention[cuda]==0.6.0",
    "bitsandbytes>=0.50",
    "jlens",
    "numpy",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "safetensors",
    "tqdm",
]

[dependency-groups]
dev = ["pytest", "ruff", "ipykernel"]

[tool.uv.sources]
jlens = { git = "https://github.com/anthropics/jacobian-lens", rev = "581d398613e5602a5af361e1c34d3a92ea82ba8e" }

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
